<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
  <title>Login</title>
</head>

<body>
    <header class="topbar">
      <a href="/index.html" class="brand">
        <img src="/images/logo.png" alt="Play4All logo" class="logo" />
        <div class="app-name">Play4All</div>
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="mainNav">
        <span class="menu-toggle-line"></span>
        <span class="menu-toggle-line"></span>
        <span class="menu-toggle-line"></span>
      </button>
      <nav class="nav" id ="mainNav">
        <a class="pill" href="/games.html">Games</a>
        <a class="pill" href="/about.html">About</a>
        <a class="pill" href="/index.html#faq">FAQ</a>

        <a class="pill" href="/chat" id="chatLink" style="display:none">Chat</a>

        <div class="account-dropdown">
          <a class="pill pill-ghost" href="/login" id="loginLink">Log in</a>
        </div>
      </nav>
    </header>
    <div class="nav-overlay" id="navOverlay"></div>
  <main>
    <h1 id="title">Login</h1>

    <form id="authForm">
      <input id="firstName" type="text" placeholder="First name*" style="display:none" />
      <input id="lastName" type="text" placeholder="Last name*" style="display:none" />
      <input id="username" type="text" placeholder="Username*" style="display:none" />
      <textarea id="bio" placeholder="Bio (optional)" style="display:none"></textarea>
      <div id="avatarSection" style="display:none">
        <p>Select avatar</p>

        <div id="avatarPicker" style="display:flex; gap:10px; flex-wrap:wrap;">
          <img src="/images/avatar/user.png" data-avatar="user.png">
          <img src="/images/avatar/badminton.png" data-avatar="badminton.png">
          <img src="/images/avatar/basketball.png" data-avatar="basketball.png">
          <img src="/images/avatar/boxing.png" data-avatar="boxing.png">
          <img src="/images/avatar/climbing.png" data-avatar="climbing.png">
          <img src="/images/avatar/crossfit.png" data-avatar="crossfit.png">
          <img src="/images/avatar/cycling.png" data-avatar="cycling.png">
          <img src="/images/avatar/gym.png" data-avatar="gym.png">
          <img src="/images/avatar/hiking.png" data-avatar="hiking.png">
          <img src="/images/avatar/padel.png" data-avatar="padel.png">
          <img src="/images/avatar/pickleball.png" data-avatar="pickleball.png">
          <img src="/images/avatar/skate.png" data-avatar="skate.png">
          <img src="/images/avatar/table-tennis.png" data-avatar="table-tennis.png">
          <img src="/images/avatar/volleyball.png" data-avatar="volleyball.png">
          <img src="/images/avatar/yoga.png" data-avatar="yoga.png">
        </div>

        <input type="hidden" id="avatar" value="user.png">
      </div>

      <div id="sportsSection" style="display:none">
        <div>
          <select id="sport1">
            <option value="">Select sport*</option>
            <option value="football">Football</option>
            <option value="basketball">Basketball</option>
            <option value="volleyball">Volleyball</option>
            <option value="tennis">Tennis</option>
            <option value="padel">Padel</option>
            <option value="running">Running</option>
            <option value="gym">Gym</option>
            <option value="badminton">Badminton</option>
            <option value="handball">Handball</option>
            <option value="rugby">Rugby</option>
            <option value="pickleball">Pickleball</option>
          </select>
          <select id="sport1Level">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>

        <div>
          <select id="sport2">
            <option value="">Select sport</option>
            <option value="football">Football</option>
            <option value="basketball">Basketball</option>
            <option value="volleyball">Volleyball</option>
            <option value="tennis">Tennis</option>
            <option value="padel">Padel</option>
            <option value="running">Running</option>
            <option value="gym">Gym</option>
            <option value="badminton">Badminton</option>
            <option value="handball">Handball</option>
            <option value="rugby">Rugby</option>
            <option value="pickleball">Pickleball</option>
          </select>
          <select id="sport2Level">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>

        <div>
          <select id="sport3">
            <option value="">Select sport</option>
            <option value="football">Football</option>
            <option value="basketball">Basketball</option>
            <option value="volleyball">Volleyball</option>
            <option value="tennis">Tennis</option>
            <option value="padel">Padel</option>
            <option value="running">Running</option>
            <option value="gym">Gym</option>
            <option value="badminton">Badminton</option>
            <option value="handball">Handball</option>
            <option value="rugby">Rugby</option>
            <option value="pickleball">Pickleball</option>
          </select>
          <select id="sport3Level">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>
      </div>
      </div>
      <input id="email" type="email" placeholder="Email*" required />
      <input id="password" type="password" placeholder="Password*" required />

      <button id="submitBtn" type="submit">Login</button>
    </form>

    <p id="errorMsg" style="color:red;"></p>

    <p style="margin-top:12px;">
      <span id="toggleText">Don’t have an account?</span>
      <a href="#" id="toggleMode">Sign up</a>
    </p>
  </main>

  <footer class="footer">
    <div class="footer-left">
      <div class="brand footer-brand">
        <img src="/images/logo.png" alt="Play4All logo" class="logo footer-logo" />
        <div class="app-name">Play4All</div>
      </div>
      <p class="footer-text">
        Find nearby games, join local players, and create your own sports events.
      </p>
    </div>

    <div class="footer-mid">
      <a class="footer-link" href="/games.html">Games</a>
      <a class="footer-link" href="/about.html">About</a>
      <a class="footer-link" href="/index.html#faq">FAQ</a>
      <a class="footer-link" href="/login">Log in</a>
    </div>

    <div class="footer-right">
      <div class="footer-copy">© 2026 Play4All</div>
      <a class="footer-link" href="#privacy">Privacy</a>
      <a class="footer-link" href="#terms">Terms</a>
    </div>
  </footer>

  <script src="/js/pages/login.js"></script>
  <script type="module" src="/js/pages/initHeader.js"></script>
</body>
</html>
