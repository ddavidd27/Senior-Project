<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="create.css" />
  <title>Create Game</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
</head>

<body>
    <header class="topbar">
      <a href="/index.html" class="brand">
        <img src="/images/logo.png" alt="Play4All logo" class="logo" />
        <div class="app-name">Play4All</div>
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="mainNav">
        <span class="menu-toggle-line"></span>
        <span class="menu-toggle-line"></span>
        <span class="menu-toggle-line"></span>
      </button>
      <nav class="nav" id ="mainNav">
        <a class="pill" href="/games.html">Games</a>
        <a class="pill" href="/about.html">About</a>
        <a class="pill" href="/index.html#faq">FAQ</a>

        <a class="pill" href="/chat" id="chatLink" style="display:none">Chat</a>

        <div class="account-dropdown">
          <a class="pill pill-ghost" href="/login" id="loginLink">Log in</a>
        </div>
      </nav>
    </header>
    <div class="nav-overlay" id="navOverlay"></div>

  <main style="margin-top:100px; padding:20px; max-width:720px; margin-left:auto; margin-right:auto;">

    <h1>Create a Game</h1>
    <form id="createGameForm" class="card" style="padding:20px; display:grid; gap:16px;">
      <label>
        Sport*
        <select id="sport" required>
          <option value="">Select...</option>
        </select>
      </label>

      <label>
        Game Type*
        <select id="type" required>
          <option value="">Select…</option>
          <option value="pickup">Pick up</option>
          <option value="casual">Casual</option>
          <option value="compe">Compe</option>
        </select>
      </label>
      <label>
        Day*
        <input id="date" type="date" required />
      </label>
      <label>
        Time*
        <input id="startTime" type="time" required />
      </label>
      <label>
        Required Level*
        <select id="level" required>
          <option value="">Select…</option>
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </label>
      <label>
        People needed*
        <input id="peopleNeeded" type="number" min="1" value="4" required />
      </label>
      <label>
        Location*
        <div style="display:grid; gap:10px;">
          <input id="locationName" type="text" placeholder="e.g. eastpark" required />

          <button id="openMapBtn" class="btn" type="button">
            Pick on map
          </button>
          <input type="hidden" id="locationLat" />
          <input type="hidden" id="locationLng" />
          <input type="hidden" id="locationPlaceId" />
        </div>
      </label>
      <div id="mapModal" class="modal hidden" aria-hidden="true">
        <div class="modal-card">
          <div class="modal-header">
            <strong>Select a place</strong>
            <button id="closeMapBtn" class="btn" type="button">Close</button>
          </div>

          <input id="pac-input" class="input" type="text" placeholder="Search a court or sports center…" />
          <div id="selectedLocationPreview" style="font-size:14px; opacity:.85;">
            No location selected yet.
          </div>
          <button id="confirmMapBtn" class="btn btn-primary" type="button" disabled>
            Confirm location
          </button>

          <div id="map" style="width:100%; height:60vh; border-radius:12px;"></div>

          <p style="margin:10px 0 0; opacity:0.8; font-size:14px;">
            Tip: search “padel court”, “tennis court”, “sports center”, etc.
          </p>
        </div>
      </div>
      <button class="btn btn-primary" type="submit">
        Create Game
      </button>
      <p id="errorMsg" style="color:red; margin:0;"></p>
    </form>
  </main>
  <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDLlYNiMFHd3itZw0XeTF_akmRDoY0JC5M&libraries=places&v=weekly"
      defer
    ></script>

    <footer class="footer">
      <div class="footer-left">
        <div class="brand footer-brand">
          <img src="/images/logo.png" alt="Play4All logo" class="logo footer-logo" />
          <div class="app-name">Play4All</div>
        </div>
        <p class="footer-text">Find nearby games, join local players, and create your own sports events.</p>
      </div>

      <div class="footer-mid">
        <a class="footer-link" href="/games.html">Games</a>
        <a class="footer-link" href="/about.html">About</a>
        <a class="footer-link" href="/index.html#faq">FAQ</a>
      </div>

      <div class="footer-right">
        <div class="footer-copy">© 2026 Play4All</div>
        <a class="footer-link" href="/privacy.html">Privacy</a>
        <a class="footer-link" href="/terms.html">Terms</a>
      </div>
    </footer>
    <script src="/js/pages/create.js"></script>
    <script type="module" src="/js/pages/initHeader.js"></script>
</body>
</html>
