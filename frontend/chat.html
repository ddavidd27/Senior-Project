<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Chat - Play4All</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="chat.css" />
</head>

<body>
    <header class="topbar">
      <a href="/index.html" class="brand">
        <img src="/images/logo.png" alt="Play4All logo" class="logo" />
        <div class="app-name">Play4All</div>
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="mainNav">
        <span class="menu-toggle-line"></span>
        <span class="menu-toggle-line"></span>
        <span class="menu-toggle-line"></span>
      </button>
      <nav class="nav" id ="mainNav">
        <a class="pill" href="/games.html">Games</a>
        <a class="pill" href="/about.html">About</a>
        <a class="pill" href="/index.html#faq">FAQ</a>

        <a class="pill" href="/chat" id="chatLink" style="display:none">Chat</a>

        <div class="account-dropdown">
          <a class="pill pill-ghost" href="/login" id="loginLink">Log in</a>
        </div>
      </nav>
    </header>
          <div class="nav-overlay" id="navOverlay"></div>

  <div class="wrap">
    <div class="top">
      <div class="brand">
        <img src="/images/logo.png" alt="Play4All logo" class="logo" />
        <div>Play4All Chat</div>
      </div>

      <div id="meLabel" style="color:var(--muted); font-size:13px;"></div>
    </div>

    <div class="main">
      <div class="panel">
        <h2>Friends</h2>
        <div id="friends" class="friends"></div>
      </div>

      <div class="panel">
        <div class="chatHead">
          <div>
            <div id="chatTitle" class="chatTitle">Pick a friend</div>
            <div id="chatSub" class="chatSub">Start chatting</div>
          </div>
        </div>

        <div id="messages" class="messages"></div>

        <div class="composer" id ="composer">
          <input id="messageInput" placeholder="Write a message..." />
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-left">
      <div class="brand footer-brand">
        <img src="/images/logo.png" alt="Play4All logo" class="logo footer-logo" />
        <div class="app-name">Play4All</div>
      </div>
      <p class="footer-text">
        Find nearby games, join local players, and create your own sports events.
      </p>
    </div>

    <div class="footer-mid">
      <a class="footer-link" href="/games.html">Games</a>
      <a class="footer-link" href="/about.html">About</a>
      <a class="footer-link" href="/index.html#faq">FAQ</a>
    </div>

    <div class="footer-right">
      <div class="footer-copy">© 2026 Play4All</div>
      <a class="footer-link" href="/privacy.html">Privacy</a>
      <a class="footer-link" href="/terms.html">Terms</a>
    </div>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/pages/chat.js"></script>
  <script type="module" src="/js/pages/initHeader.js"></script>
</body>
</html>
